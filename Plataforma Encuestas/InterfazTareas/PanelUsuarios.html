<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuestas Privadas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 
  <link rel="stylesheet" href="../css/Inicio.css">
</head>
<body id="bodyTareas">

  <div class="container mt-3">
    <div class="header-container">
      <button id="logout-button" class="btn btn-danger">
        <i class="fas fa-sign-out-alt"></i>
      </button>
      <h2 class="mb-4">Encuestas</h2>
    </div>
    <div class="search-container">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Buscar Encuesta..." 
        oninput="filtrarTareas()" 
      />
    </div>
    <div id="lista-encuestas" class="task-list"></div>
  </div>

  <script src="../Js/usuarioTraeas.js"></script>
</body>
</html>

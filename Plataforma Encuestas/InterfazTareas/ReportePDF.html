<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte de Encuesta</title>
  <link rel="stylesheet" href="../css/ReportePDF.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
</head>
<body>
  <div class="container">
    <!-- Información de la encuesta -->
    <div id="encuesta-container">
      <h2><span role="img" aria-label="clipboard">📋</span> Encuesta: Cargando...</h2>
      <p><strong>Descripción:</strong> Cargando...</p>
      <p><strong>Expira:</strong> Cargando...</p>
    </div>

    <!-- Preguntas y resultados -->
    <div id="preguntas-container">
      <!-- Aquí se mostrarán las preguntas con las respuestas -->
    </div>

    <!-- Boton para exportar el reporte a PDF -->
    <button id="exportar-pdf"><span role="img" aria-label="download">⬇️</span> Exportar a PDF</button>
    <a href="DashBoard.html"><button id="exportar-pdf"><span role="img" aria-label="download">🏠</span> Volver a Dashboard</button></a>
  </div>
</div>

</div>

  <script src="../Js/ReportePDF.js"></script>
</body>
</html>
